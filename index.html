<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FakeorFriend · How is your connection?</title>
    <meta name="description" content="Explore how two people communicate in a chat excerpt." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..900,0..100;1,9..144,400..900,0..100&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/polish.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <strong>FakeorFriend</strong>
      <span data-i18n="tagline">A closer look at a two-person chat</span>
      <span data-i18n="volume">Vol. I · 2026</span>
      <select id="language" data-i18n-attr="aria-label: language"></select>
    </header>

    <main>
      <section class="hero">
        <div class="hero-heading"><p class="hero-overline" data-i18n="heroOverline"></p><h1 data-i18n-html="hero">How is your <em>connection</em>?</h1></div>
        <div class="hero-aside"><p class="lede" data-i18n="lede"></p>
          <div class="hero-art" aria-hidden="true"><span class="bubble-one">✦</span><span class="bubble-two">↗</span><span class="art-orbit"></span><img class="hero-mouse" src="img/animals/mouse.svg" alt="" width="110" height="110" /><img class="hero-cat" src="img/animals/cat.svg" alt="" width="104" height="104" /></div>
        </div>
      </section>

      <nav class="journey" aria-label="Analysis steps" data-i18n-attr="aria-label: flowLabel">
        <span class="journey-step is-current" data-stage="input" aria-current="step"><span class="journey-index">01</span><span data-i18n="flowInput"></span></span>
        <span class="journey-step" data-stage="analyse"><span class="journey-index">02</span><span data-i18n="flowAnalyse"></span></span>
        <span class="journey-step" data-stage="result"><span class="journey-index">03</span><span data-i18n="flowResult"></span></span>
      </nav>

      <section class="intake">
        <div class="intake-label"><span class="step-label" data-i18n="stageInput"></span><b data-i18n="exhibit">Your chat</b><span data-i18n="evidence">Two people</span></div>
        <div>
          <p id="pair-hint" class="partner-caveat" data-i18n="pairHint"></p>
          <textarea
            id="chat"
            spellcheck="false"
            data-i18n-attr="aria-label: chatLabel; placeholder: chatPlaceholder"
          ></textarea>
          <div id="subjects" class="subjects" aria-live="polite"></div>
          <div class="data-notice">
            <p data-i18n="fineprint"></p>
            <p data-i18n="youthNotice"></p>
            <p id="raw-notice" data-i18n="rawNotice" hidden></p>
          </div>
          <div class="intake-bar">
            <button id="open-file" class="secondary" type="button">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 14v5h14v-5" /></svg>
              <span data-i18n="openFile"></span>
            </button>
            <input id="file" type="file" hidden accept=".txt,.zip,.json,.html,.htm,.csv,.tsv,text/plain,application/zip,application/json,text/html,text/csv" />
            <button id="sample" class="link" type="button" data-i18n="sample"></button>
            <button id="sound-toggle" class="secondary sound-toggle" type="button" aria-pressed="true"></button>
            <button id="judge" class="primary" type="button" disabled data-i18n="judge"></button>
          </div>
          <form id="names-form" class="names-form" hidden>
            <label for="names" data-i18n="namesLabel"></label>
            <input id="names" autocomplete="off" data-i18n-attr="placeholder: namesPlaceholder" />
            <button type="submit" data-i18n="namesSubmit"></button>
          </form>
          <form id="key-form" class="key-form" hidden>
            <input
              id="key"
              type="password"
              autocomplete="off"
              required
              data-i18n-attr="placeholder: keyPlaceholder; aria-label: keyLabel"
            />
            <button type="submit" data-i18n="keySubmit"></button>
          </form>
          <div class="key-storage">
            <p data-i18n="keyStorage"></p>
            <button id="clear-key" class="link" type="button" data-i18n="clearKey"></button>
            <p id="key-status" role="status" hidden></p>
          </div>
          <p id="error" class="error" role="alert" hidden></p>
        </div>
      </section>

      <section id="lab" class="lab" aria-labelledby="lab-title" hidden>
        <div class="lab-visual" aria-hidden="true"><span class="lab-orbit lab-orbit-one"></span><span class="lab-orbit lab-orbit-two"></span><span class="lab-bubble lab-bubble-a"></span><span class="lab-bubble lab-bubble-b"></span><span class="lab-symbol">✦</span></div>
        <div class="lab-copy">
          <p class="step-label" data-i18n="flowAnalyse"></p>
          <h2 id="lab-title" data-i18n="labTitle"></h2>
          <p class="lab-intro" data-i18n="labIntro"></p>
          <div class="lab-progress" aria-hidden="true"><span></span></div>
          <ol id="lab-log" class="lab-log"></ol>
          <p id="lab-phase" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
        </div>
      </section>

      <section id="results" class="results" aria-live="polite" hidden>
        <p class="step-label" data-i18n="stageResult"></p>
        <article class="connection-summary spotlight-shell" aria-label="Result highlights" data-i18n-attr="aria-label: spotlight.heading">
          <div class="duo-section" aria-labelledby="duo-title">
            <p class="spotlight-index" data-i18n="spotlight.first"></p>
            <h2 id="duo-title" tabindex="-1" data-i18n="spotlight.animals"></h2>
            <div id="animal-duo" class="animal-duo"></div>
            <p data-i18n="animalMeaning" class="duo-caveat"></p>
          </div>
          <section class="story-section vibe-spotlight" aria-labelledby="story-title">
            <div class="vibe-copy"><p class="spotlight-index" data-i18n="spotlight.second"></p><p class="vibe-tag" id="connection-label"></p><h2 id="story-title"></h2><p id="story-body"></p><p class="vibe-disclaimer" data-i18n="spotlight.disclaimer"></p></div>
            <img id="vibe-sticker" src="img/vibes/uncertain.svg" width="160" height="130" alt="" />
          </section>
          <section class="moment-spotlight" aria-labelledby="moment-heading">
            <p class="spotlight-index" data-i18n="spotlight.third"></p>
            <h2 id="moment-heading" data-i18n="spotlight.moment"></h2>
            <h3 id="moment-title"></h3><p id="moment-detail"></p>
          </section>
          <div class="share-action spotlight-share"><button id="share" class="primary" type="button" data-i18n="share"></button></div>
          <p id="scope-note" class="scope-note"></p>
          <p class="spotlight-guide" data-i18n="spotlight.guide"></p>
        </article>
        <div class="explore-details">
          <details class="explore-panel" id="detail-reading"><summary data-i18n="spotlight.moreReading"></summary><div class="explore-body">
          <p id="connection-note"></p>
          <p id="duo-extra" class="duo-extra" hidden></p>
          <section class="reading-section" aria-labelledby="reading-title">
            <div class="reading-intro"><p class="step-label" data-i18n="reading.eyebrow"></p><h3 id="reading-title" data-i18n="reading.title"></h3><p data-i18n="reading.subtitle"></p></div>
            <div id="person-readings" class="person-readings"></div>
          </section>
          <section class="cues-section" aria-labelledby="cues-title">
            <p class="step-label" data-i18n="cues.eyebrow"></p>
            <h3 id="cues-title" data-i18n="cues.title"></h3>
            <p class="cues-intro" data-i18n="cues.intro"></p>
            <h4 data-i18n="cues.topicsTitle"></h4>
            <div id="topic-cards" class="cue-grid"></div>
            <p id="topic-empty" class="cue-empty"></p>
            <h4 data-i18n="cues.toneTitle"></h4>
            <p id="tone-overview" class="cue-overview" hidden></p>
            <div id="tone-cards" class="cue-grid"></div>
            <p id="tone-empty" class="cue-empty"></p>
            <p class="cue-limit" data-i18n="cues.limits"></p>
            <details class="cue-method"><summary data-i18n="cues.methodTitle"></summary><p data-i18n="cues.method"></p></details>
          </section>
          <section class="vibe-panel idea-panel" aria-labelledby="idea-title"><h3 id="idea-title" data-i18n="visual.ideaTitle"></h3><p id="conversation-idea"></p></section>
          </div></details>
          <details class="explore-panel" id="detail-charts"><summary data-i18n="spotlight.moreCharts"></summary><div class="explore-body">
          <h3 class="scales-heading" data-i18n="reading.scalesTitle"></h3>
          <div id="connection-scales" class="measures"></div>
          <div class="vibe-gallery">
          <section id="map-panel" class="vibe-panel" aria-labelledby="map-title">
            <h3 id="map-title" data-i18n="visual.mapTitle"></h3>
            <p data-i18n="visual.mapIntro"></p>
            <div id="vibe-map" class="vibe-map" role="img">
              <span class="axis-label top" data-i18n="visual.moreTension"></span>
              <span class="axis-label bottom" data-i18n="visual.lessTension"></span>
              <span class="axis-label left" data-i18n="visual.lessWarmth"></span>
              <span class="axis-label right" data-i18n="visual.moreWarmth"></span>
              <span id="map-dot" class="map-dot"></span>
            </div>
            <p id="map-n" class="chart-n"></p>
          </section>
          <section id="balance-panel" class="vibe-panel" aria-labelledby="balance-title" hidden>
            <h3 id="balance-title" data-i18n="visual.balanceTitle"></h3>
            <p data-i18n="visual.balanceIntro"></p>
            <div id="balance-bars" class="balance-bars"></div>
          </section>
        </div>
        <section class="timeline-panel" aria-labelledby="timeline-title">
          <h3 id="timeline-title" data-i18n="timeline.title"></h3>
          <p data-i18n="timeline.intro"></p>
          <div id="timeline-content"></div>
          <details class="timeline-method"><summary data-i18n="timeline.methodTitle"></summary><p data-i18n="timeline.method"></p></details>
        </section>
        <section class="outlook-panel" aria-labelledby="outlook-title">
          <p class="step-label" data-i18n="outlook.eyebrow"></p>
          <h3 id="outlook-title" data-i18n="outlook.title"></h3>
          <p class="outlook-intro" data-i18n="outlook.intro"></p>
          <div id="outlook-content"></div>
          <details class="outlook-method"><summary data-i18n="outlook.methodTitle"></summary><p data-i18n="outlook.method"></p></details>
        </section>
          </div></details>
          <details class="explore-panel" id="detail-numbers"><summary data-i18n="spotlight.moreNumbers"></summary><div class="explore-body">
        <h3 class="stats-heading" data-i18n="statsTitle"></h3>
        <div id="records" class="records"></div>
        <div id="plates" class="plates"></div>
        <details class="method-note">
          <summary data-i18n="visual.methodTitle"></summary>
          <p data-i18n="visual.methodIntro"></p>
          <p><a href="https://openstax.org/books/lifespan-development/pages/10-4-social-contexts-in-adolescence" target="_blank" rel="noreferrer" data-i18n="visual.bookLink"></a></p>
          <p><a href="https://openstax.org/books/psychology-2e/pages/12-7-prosocial-behavior" target="_blank" rel="noreferrer" data-i18n="visual.bookLink2"></a></p>
          <p><a href="https://pubmed.ncbi.nlm.nih.gov/36834137/" target="_blank" rel="noreferrer" data-i18n="visual.studyLink"></a></p>
        </details>
        <details class="technical-details"><summary data-i18n="technicalTitle"></summary><p id="footnote" class="footnote"></p></details>
          </div></details>
        </div>
      </section>
    </main>

    <footer class="colophon" data-i18n="colophon"></footer>

    <dialog id="card-dialog" class="card-dialog">
      <canvas id="card-canvas" width="1080" height="1350"></canvas>
      <form method="dialog" class="card-controls">
        <fieldset>
          <legend data-i18n="cardNames"></legend>
          <div id="card-names" class="card-names"></div>
        </fieldset>
        <p class="card-score-note" data-i18n="cardScoreNote"></p>
        <p class="card-preview-heading" data-i18n="cardPreviewHeading"></p>
        <ul id="card-preview-details" class="card-preview-details"></ul>
        <p class="card-score-note" data-i18n="cardPrivacyNote"></p>
        <button id="card-share" class="primary" type="button" data-i18n="cardShare"></button>
        <button id="card-download" class="primary" type="button" data-i18n="cardDownload"></button>
        <button class="link" value="close" data-i18n="cardClose"></button>
      </form>
    </dialog>

    <template id="plate">
      <article class="plate">
        <h2 class="plate-name"></h2>
        <div class="stats-caption" hidden></div>
        <dl class="counted"></dl>
      </article>
    </template>

    <template id="scale">
      <div class="scale">
        <div class="scale-top"><span class="scale-name"></span><span class="scale-confidence"></span></div>
        <div class="track" tabindex="0"><div class="fill"></div></div>
        <div class="scale-level"></div>
      </div>
    </template>

    <template id="finding">
      <div class="finding"><dt></dt><dd></dd></div>
    </template>
  </body>
</html>
